[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r0"
version = "0.1.0"
description = "Simulateur de propagation d'épidémie : modèle compartimental configurable, moteurs déterministe et stochastique."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[project.scripts]
r0 = "r0.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/r0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
