name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv -p 3.12
          uv pip install -e ".[dev]"
      - name: Tests
        run: uv run --no-sync pytest -q
